<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As 5 Linguagens do Amor</title>
    <style>
        :root {
            --primary: #e91e63;
            --primary-dark: #c2185b;
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tela 1: Intro */
        #screen-intro h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Tela 2: Seleção de Sexo */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .gender-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 40px 30px;
            width: 220px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .gender-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(233, 30, 99, 0.2);
            border-color: var(--primary);
        }

        .gender-symbol {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .gender-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Tela 3: Questionário */
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 30px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid #eee;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Tela 4: Resultados */
        .results-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .result-score {
            background-color: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn-print {
            margin-top: 30px;
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-print:hover {
            background-color: #000;
        }

        /* Estilos de Impressão (PDF) */
        @media print {
            body {
                background-color: white;
                display: block;
                padding: 0;
            }
            .screen {
                display: none !important;
            }
            #screen-results {
                display: block !important;
                max-width: 100%;
                animation: none;
            }
            .btn-print {
                display: none !important;
            }
            .results-container {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            /* Forçar impressão de cores de fundo */
            .result-score {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

        // Função para trocar de tela

                screen.classList.remove('active');

            document.getElementById(screenId).classList.add('active');
        }

        // Inicialização: Tela 1 -> Tela 2 após 3 segundos
        window.onload = function() {

        // Iniciar o Quiz
        function startQuiz(gender) {

            renderQuestion();
        }

        // Renderizar Pergunta
        function renderQuestion() {
            const question = currentQuizData.perguntas[currentQuestionIndex];
            
            // Atualizar barra de progresso
            const progress = ((currentQuestionIndex) / currentQuizData.perguntas.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;

            // Atualizar texto da pergunta (usando as duas opções como a "pergunta" em si, conforme o formato do JSON)
            document.getElementById('question-text').textContent = "Qual destas afirmações melhor descreve o que você prefere?";

            // Renderizar opções
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            question.opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opcao.texto;
                btn.onclick = () => handleAnswer(opcao.letra);
                optionsContainer.appendChild(btn);
            });
        }

        // Processar Resposta
        function handleAnswer(letra) {
            scores[letra]++;
            currentQuestionIndex++;

            if (currentQuestionIndex < currentQuizData.perguntas.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        // Mostrar Resultados
        function showResults() {
            // Converter objeto de scores em array e ordenar de forma decrescente
            const sortedScores = Object.entries(scores)
                .map(([letra, pontuacao]) => ({
                    nome: currentQuizData.linguagens[letra],
                    pontuacao: pontuacao,
                    letra: letra
                }))
                .sort((a, b) => b.pontuacao - a.pontuacao);

            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            sortedScores.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                // Destacar a primeira colocada
                const isTop = index === 0 ? 'style="color: var(--primary); font-size: 1.2rem;"' : '';
                
                div.innerHTML = `
                    <span class="result-name" ${isTop}>${index + 1}º. ${item.nome}</span>
                    <span class="result-score">${item.pontuacao} pts</span>
                `;
                resultsList.appendChild(div);
            });

            showScreen('screen-results');
        }
    </script>
</body>
</html>
